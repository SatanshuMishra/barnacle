name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: catalog
        run: |
          name="$(tr -d '[:space:]' < catalog.version)"
          test -n "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - id: image
        run: |
          name="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "name=$name" >> "$GITHUB_OUTPUT"
        env:
          REPOSITORY: ${{ github.repository }}

      - run: |
          gh release download "catalog-${{ steps.catalog.outputs.name }}" \
            --pattern '*.tar.gz' \
            --output catalog.tar.gz \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: barnacle:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: ./.github/scripts/smoke.sh barnacle:smoke

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:catalog-${{ steps.catalog.outputs.name }}
          cache-from: type=gha
