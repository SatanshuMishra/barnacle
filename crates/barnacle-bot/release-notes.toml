[[release]]
version = "0.2.0"
summary = "This update lets you play several silhouette rounds in a row and lets servers choose where Barnacle posts news."

[[release.feature]]
title = "Silhouette series"
story = [
    "Until now, each round of the ship silhouette game (/guess) had to be started by hand, one at a time.",
    "A series plays up to 20 rounds back to back and keeps score for everyone taking part.",
]
steps = [
    "Type /guess-series in any channel where /guess works.",
    "Choose how many rounds to play, from 2 to 20; if you leave it out, you get 10.",
    "Name each ship in chat as it appears, just like /guess.",
]
expect = [
    "A 5-second countdown appears before every ship, so you are ready to answer.",
    "After each round, the standings show who has won the most rounds and who was fastest so far.",
    "The standings clear away when the next ship appears, so the channel stays tidy.",
    "If nobody talks for three rounds, Barnacle asks if you are still playing; press Yes within 10 seconds to keep going.",
    "When the series ends, the final standings stay in the channel for everyone to see.",
]

[[release.feature]]
title = "Update news channel"
audience = "server managers"
story = [
    "Barnacle can now post news like this in a channel your server picks, so members hear about changes as they happen.",
]
steps = [
    "Someone with Manage Server types /updates setup.",
    "They pick the channel for the news and, if they like, a role to notify.",
]
