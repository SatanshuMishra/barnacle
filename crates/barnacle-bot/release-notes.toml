[[release]]
version = "0.2.0"
changed = []
fixed = []

[[release.new]]
title = "Guess series"
what = "You can now play a series of 2 to 20 silhouette rounds in a row without starting each one yourself."
how = "Type /guess-series, choose how many rounds you want (10 if you leave it out), and answer in chat as usual."

[[release.new]]
title = "Series standings"
what = "After every round in a series, Barnacle shows who has won the most rounds and who was fastest so far."
how = "Keep playing; the standings appear under each answer, with a 5-second countdown before the next ship."

[[release.new]]
title = "Still playing check"
what = "If the chat goes quiet for three rounds, Barnacle asks if you are still playing and stops unless someone presses Yes."
how = "Press Yes within 10 seconds to keep the series going."

[[release.new]]
title = "Update news"
what = "Server managers can now choose a channel where Barnacle posts news about its updates."
how = "Someone with Manage Server types /updates setup, picks the channel, and can add a role to notify."
