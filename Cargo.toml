[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/SatanshuMishra/barnacle"

[workspace.dependencies]
barnacle-catalog = { path = "crates/barnacle-catalog" }
barnacle-guess = { path = "crates/barnacle-guess" }
wowsunpack = { version = "=0.45.0", default-features = false, features = ["parsing", "vfs"] }
wows-data-mgr = { version = "=0.21.0", default-features = false, features = ["download"] }
pickled = "=2.0.0-alpha10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
clap = { version = "4", features = ["derive"] }
deunicode = "1"
dotenvy = "0.15"
gettext = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }
poise = "0.7"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
